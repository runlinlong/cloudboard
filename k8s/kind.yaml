# Only used when creating a NEW, separate cluster named cloudboard-coursework.
# Never resets or changes Docker Desktop's Kubernetes cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18081
        listenAddress: "127.0.0.1"
        protocol: TCP
